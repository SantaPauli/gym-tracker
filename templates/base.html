<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Tracker</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#212529">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark navbar-expand-sm mb-3">
    <div class="container flex-wrap">
      <a class="navbar-brand" href="{{ url_for('suggestion') }}">🏋️ Gym Tracker</a>
      <div class="navbar-nav flex-row flex-wrap gap-3">
        <a class="nav-link text-white" href="{{ url_for('suggestion') }}">Vorschlag</a>
        <a class="nav-link text-white" href="{{ url_for('log_workout') }}">Loggen</a>
        <a class="nav-link text-white" href="{{ url_for('history') }}">Historie</a>
        <a class="nav-link text-white" href="{{ url_for('exercises') }}">Übungen</a>
        <a class="nav-link text-white" href="{{ url_for('schedule') }}">Kalender</a>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
