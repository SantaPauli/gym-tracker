{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Übungen</h1>

<form method="get" class="mb-4 d-flex gap-2 align-items-center">
  <label for="equipment" class="form-label mb-0">Equipment filtern:</label>
  <select name="equipment" id="equipment" class="form-select w-auto" onchange="this.form.submit()">
    <option value="">Alle</option>
    {% for eq in equipment_types %}
      <option value="{{ eq }}" {% if eq == equipment_filter %}selected{% endif %}>{{ eq }}</option>
    {% endfor %}
  </select>
</form>

<div class="table-responsive mb-4">
  <table class="table table-striped align-middle">
    <thead><tr><th>Name</th><th>Muskelgruppe</th><th>Equipment</th><th></th></tr></thead>
    <tbody>
    {% for ex in exercises %}
      <tr>
        <td>{{ ex.name }}</td>
        <td>{{ ex.muscle_group }}</td>
        <td>{{ ex.equipment }}</td>
        <td>
          <form method="post" action="{{ url_for('delete_exercise', exercise_id=ex.id) }}" onsubmit="return confirm('Übung löschen?');">
            <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>

<h2>Neue Übung hinzufügen</h2>
<form method="post" action="{{ url_for('add_exercise') }}" class="row g-2">
  <div class="col-sm-4">
    <input type="text" name="name" class="form-control" placeholder="Name" required>
  </div>
  <div class="col-sm-3">
    <select name="muscle_group" class="form-select" required>
      {% for mg in muscle_groups %}<option value="{{ mg }}">{{ mg }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-sm-3">
    <select name="equipment" class="form-select" required>
      {% for eq in equipment_types %}<option value="{{ eq }}">{{ eq }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-sm-2">
    <button type="submit" class="btn btn-primary w-100">Hinzufügen</button>
  </div>
</form>
{% endblock %}
