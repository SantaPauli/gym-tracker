{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Nächstes Training planen</h1>
<form method="post" action="{{ url_for('schedule') }}" class="row g-2">
  <div class="col-sm-4">
    <label class="form-label">Datum</label>
    <input type="date" name="date" class="form-control" value="{{ today }}" required>
  </div>
  <div class="col-sm-4">
    <label class="form-label">Uhrzeit</label>
    <input type="time" name="time" class="form-control" value="18:00" required>
  </div>
  <div class="col-sm-4 d-flex align-items-end">
    <button type="submit" class="btn btn-primary w-100">Kalendertermin herunterladen (.ics)</button>
  </div>
</form>
<p class="mt-3 text-muted">Die heruntergeladene Datei kannst du in Google Calendar, Apple Kalender oder Outlook importieren.</p>
{% endblock %}
